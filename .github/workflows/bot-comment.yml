# Post a PR comment under the CONVERSION BOT identity (the GitHub App), NOT the maintainer.
#
# Companion to open-conversion-pr.yml — SAME App, SAME server-side token model: the App private key
# lives ONLY in repo secrets and is minted in-CI, so the comment posts as `tropelang-conversion-bot[bot]`
# regardless of whether the dispatch came from a LOCAL or a CLOUD (Claude Code web) session. No
# session ever holds the key.
#
# Prerequisite repo secrets (already present for open-conversion-pr.yml):
#   CONVERSION_APP_ID           the conversion App's numeric App ID
#   CONVERSION_APP_PRIVATE_KEY  the conversion App's PEM private key
# Permissions: the conversion App needs **Pull requests: write** (it has it). PR *conversation* comments
# are "issue comments" — if the issues endpoint 403s, also grant the App **Issues: write**.
# DEDICATED workflow: never fold the App key into gate.yml or the publish pipeline.
#
# The bot may COMMENT but must never APPROVE its own PR (the identity rule in CONVERSION_BOT.md) —
# approval stays with a human maintainer.
#
# ── Driven by workflow_dispatch only ───────────────────────────────────────────────────────────────
# Whoever dispatches never holds the App key; the App does the write. Two entry points:
#  A) Cloud session (Mode A; no `gh`) — dispatch via the GitHub MCP:
#       mcp__github__actions_run_trigger  method=run_workflow  workflow_id=bot-comment.yml  ref=main
#         inputs={ pr: <N>, body: '…markdown…' [, reply_to: <review_comment_id>] }
#  B) Local / anywhere with `gh`:
#       gh workflow run bot-comment.yml -f pr=38 -f body='…markdown…'
#       gh workflow run bot-comment.yml -f pr=38 -f body='…' -f reply_to=<review_comment_id>   # in-thread reply

name: bot-comment

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to comment on
        required: true
        type: string
      body:
        description: Comment body (Markdown)
        required: true
        type: string
      reply_to:
        description: (optional) review-comment id to reply to in-thread; omit for a PR conversation comment
        required: false
        type: string

permissions:
  contents: read        # the job's own GITHUB_TOKEN stays read-only; the App token does the comment write

concurrency:
  group: bot-comment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  comment:
    # upstream only — forks never see the secrets
    if: github.repository == 'kelnishi/tropelang-standard'
    runs-on: ubuntu-latest
    steps:
      - name: Mint conversion-bot App token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CONVERSION_APP_ID }}
          private-key: ${{ secrets.CONVERSION_APP_PRIVATE_KEY }}

      - name: Post dispatched comment
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          BODY: ${{ inputs.body }}
          REPLY_TO: ${{ inputs.reply_to }}
        run: |
          set -euo pipefail
          if [ -n "${REPLY_TO}" ]; then
            # threaded reply to an inline review comment
            gh api "repos/${REPO}/pulls/${PR}/comments" \
              -F in_reply_to="${REPLY_TO}" -f body="${BODY}" -q '.html_url'
          else
            # PR conversation (issue) comment
            gh api "repos/${REPO}/issues/${PR}/comments" \
              -f body="${BODY}" -q '.html_url'
          fi
