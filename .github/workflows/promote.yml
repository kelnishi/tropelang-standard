# Promote / rollback a channel (spec 19 §7.3). The channel pointers in `channels/` are the committed
# source of truth; this mirrors them to R2 and regenerates the discovery index — no rebuild, no immutable
# write. Promotion = edit `channels/<id>.<channel>.json` to a NEW (already-published) version via PR, and
# merge it; rollback = point it back at a prior version (still immutable in R2). Within the channel TTL
# (~30 s) every consumer serves the new version.
#
# Same `production` environment + `concurrency` group as publish.yml, so R2 writes are serialized and a
# maintainer must approve.
name: promote
on:
  push:
    branches: [main]
    paths: ['channels/**']
  workflow_dispatch: {}            # manual re-sync of the committed channels → R2 + registry

permissions:
  contents: read

concurrency: publish

jobs:
  promote:
    if: github.repository == 'kelnishi/tropelang-standard'   # Cloudflare channel mirror is upstream-only; forks use pages.yml
    runs-on: ubuntu-latest
    environment: production
    env:
      R2_BUCKET: tropelang-corpus
      CORPUS_BASE_URL: https://corpus.tropelang.com
      # R2 object I/O over the S3-compatible API (bucket-scoped R2 token). Same secrets as publish.yml.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_S3_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4

      # Mirrors channels/ → R2 and regenerates registry.json. sync-registry pulls each channel-pointed
      # manifest from R2; a pointer ahead of its bundle (e.g. first-publish bootstrap) is warned + skipped,
      # so the registry's metadata reflects the version a channel actually serves.
      - name: mirror channels + regenerate registry
        run: bash scripts/sync-registry.sh

      - name: summary
        run: |
          echo "### Channels mirrored + registry regenerated" >> "$GITHUB_STEP_SUMMARY"
          for f in channels/*.json; do
            echo "- \`$(jq -r .id "$f")\` / \`$(jq -r .channel "$f")\` → \`$(jq -r .version "$f")\`" >> "$GITHUB_STEP_SUMMARY"
          done
