# Move the stable channel pointer to an already-published version, and keep the repo in sync with R2
# (spec 19 §7.3). This is the ONLY promotion path: pick a version in the Actions UI → the action writes
# the pointer to R2, regenerates the discovery registry, and commits channels/<id>.stable.json back to
# main so git and R2 never drift. Deploy ("Rollup Version and Deploy") makes a version AVAILABLE; this
# makes it LIVE. Rollback = run it again naming a prior (still-immutable) version. Upstream-only.
#
# Same `production` environment + `concurrency` group as publish.yml, so R2 writes are serialized and a
# maintainer must approve.
name: Promote Stable and Sync
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote stable to (must already be published). Blank = corpus.toml's current version."
        required: false
        default: ""

permissions:
  contents: read

concurrency: publish          # serialize with publish.yml's R2 writes

jobs:
  promote:
    if: github.repository == 'kelnishi/tropelang-standard'   # Cloudflare channel mirror is upstream-only; forks use pages.yml
    runs-on: ubuntu-latest
    environment: production     # holds R2_*/CLOUDFLARE_* ; gated by a required reviewer
    env:
      R2_BUCKET: tropelang-corpus
      CORPUS_BASE_URL: https://corpus.tropelang.com
      # R2 object I/O over the S3-compatible API (bucket-scoped R2 token). Same secrets as publish.yml.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_S3_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      # Mint the bot token FIRST and check out WITH it, so the commit-back at the end pushes as the App.
      - name: mint conversion-bot token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CONVERSION_APP_ID }}
          private-key: ${{ secrets.CONVERSION_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}

      - name: resolve version + repoint the committed pointer
        id: tgt
        run: |
          ID=$(grep -E '^id[[:space:]]*=' trl/tropes/corpus.toml | head -1 | cut -d'"' -f2)
          VER='${{ inputs.version }}'
          [ -n "$VER" ] || VER=$(grep -E '^version[[:space:]]*=' trl/tropes/corpus.toml | head -1 | cut -d'"' -f2)
          echo "id=$ID" >> "$GITHUB_OUTPUT"; echo "ver=$VER" >> "$GITHUB_OUTPUT"
          # Refuse to promote a version whose immutable bundle isn't published — it would 404 the channel.
          if ! aws s3api head-object --endpoint-url "$R2_S3_ENDPOINT" --bucket "$R2_BUCKET" --key "$ID/$VER/manifest.json" >/dev/null 2>&1; then
            echo "::error::$ID@$VER is not published to R2 — run the 'Rollup Version and Deploy' action first"; exit 1
          fi
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          tmp=$(mktemp)
          jq --arg v "$VER" --arg m "/$ID/$VER/manifest.json" --arg t "$ts" \
             '.version=$v | .manifest=$m | .updatedAt=$t' "channels/$ID.stable.json" > "$tmp" \
             && mv "$tmp" "channels/$ID.stable.json"

      # Mirror the updated pointer → R2 and regenerate registry.json (existing script; the bundle is
      # verified-published above, so its manifest is pulled and the registry entry is fully populated).
      - name: mirror pointer + registry to R2
        run: bash scripts/sync-registry.sh

      - name: commit the pointer back to main (git ⇄ R2 in sync)
        run: |
          ID=${{ steps.tgt.outputs.id }}; VER=${{ steps.tgt.outputs.ver }}
          if git diff --quiet -- "channels/$ID.stable.json"; then
            echo "### \`stable\` already at \`$ID@$VER\` — R2 re-synced, nothing to commit" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Promote stable → $ID $VER" -- "channels/$ID.stable.json"
          git push origin HEAD:main
          echo "### Promoted \`stable\` → \`$ID@$VER\` (live within ~30 s; repo + R2 in sync)" >> "$GITHUB_STEP_SUMMARY"
