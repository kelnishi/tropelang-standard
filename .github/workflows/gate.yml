# Untrusted PR gate — NO secrets, read-only token. Validates/gates the corpus against the pinned engine
# CLI. The publish pipeline (with the CF deploy credential) is a SEPARATE, environment-gated workflow
# (spec 22 §6.4) — never share a job with this one, and never use pull_request_target here.
  name: gate
  on:
    pull_request:
    push:
      branches: [main]
  permissions:
    contents: read
  jobs:
    gate:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: install the latest tropelang CLI
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            mkdir -p "$HOME/.local/bin"
            # Resolve the latest cli-v* release (NOT releases/latest — that can be a corpus-v* release).
            TAG=$(gh release list --repo kelnishi/tropelang-standard --limit 100 --json tagName \
                    --jq '[.[] | select(.tagName | startswith("cli-v"))][0].tagName')
            [ -n "$TAG" ] || { echo "::error::no cli-v* release found"; exit 1; }
            curl -fSL "https://github.com/kelnishi/tropelang-standard/releases/download/$TAG/tropelang-x86_64-linux" -o "$HOME/.local/bin/tropelang"
            chmod +x "$HOME/.local/bin/tropelang"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/tropelang" version
        - name: index in sync
          run: tropelang assemble trl/tropes/corpus.toml --check
        - name: gate changed tropes
          run: |
            base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
            # Gate only trope files — exclude the generated index.trl (validated by `assemble --check`,
            # not a @trope file) and the non-trope tiers (prelude/ontology/concepts/modules).
            changed=$(git diff --name-only "$base"... -- 'trl/tropes/**/*.trl' | grep -v '/index\.trl$' || true)
            [ -z "$changed" ] && echo "no trope changes" && exit 0
            for f in $changed; do
              [ -f "$f" ] || continue
              echo "── $f"; tropelang gate "$f" || exit 1
            done
        - name: changelog reminder (soft)
          if: github.event_name == 'pull_request'
          run: |
            base="${{ github.event.pull_request.base.sha }}"
            tropes=$(git diff --name-only "$base"... -- 'trl/tropes/**/*.trl' | grep -v '/index\.trl$' || true)
            cl=$(git diff --name-only "$base"... -- CHANGELOG.md || true)
            if [ -n "$tropes" ] && [ -z "$cl" ]; then
              echo "::warning title=Changelog::Tropes changed but CHANGELOG.md wasn't — add a line per trope under '## [Unreleased]' (- **Name** (category) — source)."
            fi
