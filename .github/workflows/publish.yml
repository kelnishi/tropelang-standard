# Publish an immutable corpus bundle to R2 (spec 19 Phase B.2 / spec 22 §6.4 — the TRUSTED, privileged
# pipeline). Triggered only by a maintainer pushing a `corpus-v<version>` tag. The Cloudflare credential
# lives in the `production` environment (required reviewer + fail-closed); this job is the only thing that
# writes the immutable bundle. NEVER add `pull_request`/`pull_request_target` here, and never share a job
# with the no-secret gate.
name: Rollup Version and Deploy · publish
on:
  push:
    tags: ['corpus-v*']

# Least privilege: the job reads the repo and reaches Cloudflare only via the environment secret.
permissions:
  contents: write   # create/update the GitHub Release for the corpus-v* tag (auto-diff notes)

concurrency: publish

jobs:
  publish:
    if: github.repository == 'kelnishi/tropelang-standard'   # the Cloudflare CDN is upstream-only; forks use pages.yml
    runs-on: ubuntu-latest
    environment: production          # holds CLOUDFLARE_* ; gated by a required reviewer
    env:
      # `bundle` emits corpus.trlb + trlbSha256 (spec-24 post-parse binary) as of engine 0.12.0; the old
      # cli-v0.4.0 pin predated it, so the trlb was never built and the manifest's `"trlb"` promise 404'd.
      # For this single-corpus root the newer CLI produces a byte-identical corpus.json (sha 8fe02054…), so
      # bumping the pin adds the trlb without churning the JSON.
      CLI_TAG: cli-v0.24.11          # the engine CLI release whose `bundle` emits the spec-19 manifest + spec-24 trlb
      R2_BUCKET: tropelang-corpus
      CORPUS_BASE_URL: https://corpus.tropelang.com
      # R2 object I/O over the S3-compatible API (honors a bucket-scoped R2 token). The R2 token's S3
      # credentials go in R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY; the endpoint is derived from the account.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required   # aws-cli v2 default checksums break R2
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_S3_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: install pinned tropelang CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fSL "https://github.com/kelnishi/tropelang-standard/releases/download/${CLI_TAG}/tropelang-x86_64-linux" -o "$HOME/.local/bin/tropelang"
          chmod +x "$HOME/.local/bin/tropelang"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          tropelang version

      - name: sanity — index in sync + self-check
        run: |
          tropelang assemble trl/tropes/corpus.toml --check
          tropelang selfcheck trl/tropes/corpus.toml --corpus file://trl --min-confirmed 0.70

      - name: bundle
        id: bundle
        run: |
          ID=$(grep -E '^id\s*=' trl/tropes/corpus.toml | head -1 | cut -d'"' -f2)
          VER=$(grep -E '^version\s*=' trl/tropes/corpus.toml | head -1 | cut -d'"' -f2)
          TAGVER="${GITHUB_REF_NAME#corpus-v}"
          if [ "$VER" != "$TAGVER" ]; then
            echo "::error::corpus.toml version ($VER) != tag ($TAGVER) — they must match"; exit 1
          fi
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          tropelang bundle trl/tropes/corpus.toml --out "dist/$ID/$VER" --built-at "$BUILT_AT"
          {
            echo "id=$ID"; echo "ver=$VER"; echo "built_at=$BUILT_AT";
          } >> "$GITHUB_OUTPUT"

      - name: immutability guard — refuse to overwrite a published version
        run: |
          ID=${{ steps.bundle.outputs.id }}; VER=${{ steps.bundle.outputs.ver }}
          if aws s3api head-object --endpoint-url "$R2_S3_ENDPOINT" --bucket "$R2_BUCKET" --key "$ID/$VER/manifest.json" >/dev/null 2>&1; then
            echo "::error::$ID/$VER is already published (immutable) — bump the corpus version"; exit 1
          fi
          echo "ok: $ID/$VER is new"

      - name: upload immutable bundle
        run: |
          ID=${{ steps.bundle.outputs.id }}; VER=${{ steps.bundle.outputs.ver }}
          # Payloads FIRST, manifest LAST. The manifest advertises corpus.trlb + pins its trlbSha256, and
          # the immutability guard + version catalog key on manifest.json — so it must not become visible
          # before the objects it references exist. corpus.trlb is the post-parse fast-load form the
          # manifest has always named (`"trlb": "corpus.trlb"`); it was being built by `bundle` but never
          # uploaded, so a client following the manifest 404'd on it.
          aws s3api put-object --endpoint-url "$R2_S3_ENDPOINT" --bucket "$R2_BUCKET" --key "$ID/$VER/corpus.json"   --body "dist/$ID/$VER/corpus.json"   --content-type application/json
          aws s3api put-object --endpoint-url "$R2_S3_ENDPOINT" --bucket "$R2_BUCKET" --key "$ID/$VER/corpus.trlb"   --body "dist/$ID/$VER/corpus.trlb"   --content-type application/octet-stream
          aws s3api put-object --endpoint-url "$R2_S3_ENDPOINT" --bucket "$R2_BUCKET" --key "$ID/$VER/manifest.json" --body "dist/$ID/$VER/manifest.json" --content-type application/json

      # Add this version to the engine-aware discovery catalog (/<id>/versions.json) — every PUBLISHED
      # (available) version + its engineMin, so a client can pick the newest version its engine supports
      # without relying on release ordering. Append-only RMW: fetch the current catalog (empty on first
      # publish), upsert this version (preserving any prior `yanked` flag), upload. Independent of promotion
      # — `stable` is moved later by the Promote action; the catalog tracks availability, not the live pick.
      - name: update version catalog (/<id>/versions.json)
        run: |
          ID=${{ steps.bundle.outputs.id }}; VER=${{ steps.bundle.outputs.ver }}
          mkdir -p cat man
          if aws s3api get-object --endpoint-url "$R2_S3_ENDPOINT" --bucket "$R2_BUCKET" --key "$ID/versions.json" cat/cur.json >/dev/null 2>&1; then
            echo "catalog exists — incremental add"
          else
            # First run for this corpus: bootstrap the catalog from every already-published corpus-v* tag
            # (their immutable manifests are in R2). Self-healing — runs once, then the branch above takes over.
            : > cat/cur.json
            for t in $(git tag -l 'corpus-v*'); do
              v="${t#corpus-v}"
              [ "$v" = "$VER" ] && continue
              if aws s3api get-object --endpoint-url "$R2_S3_ENDPOINT" --bucket "$R2_BUCKET" --key "$ID/$v/manifest.json" "man/$v.json" >/dev/null 2>&1; then
                node scripts/catalog-add.mjs "man/$v.json" cat/cur.json cat/cur.json
                echo "  backfilled $ID@$v"
              fi
            done
          fi
          node scripts/catalog-add.mjs "dist/$ID/$VER/manifest.json" cat/cur.json cat/versions.json
          aws s3api put-object --endpoint-url "$R2_S3_ENDPOINT" --bucket "$R2_BUCKET" --key "$ID/versions.json" --body "cat/versions.json" --content-type application/json --cache-control "no-cache"
          echo "### Cataloged \`$ID@$VER\` (engineMin $(jq -r '.versions[0].engineMin' cat/versions.json)) — $(jq '.versions|length' cat/versions.json) versions in \`/$ID/versions.json\`" >> "$GITHUB_STEP_SUMMARY"

      # Auto-diff the trope set vs the currently-live version (R2's stable pointer, read BEFORE we promote)
      # → GitHub Release notes + run summary. Complements the curated CHANGELOG.md.
      - name: release notes (auto-diff vs the live version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=${{ steps.bundle.outputs.id }}; VER=${{ steps.bundle.outputs.ver }}
          stems() { jq -r '.[].path | select(contains("/tropes/")) | split("/") | last | sub("\\.trl$";"")' "$1" | sort; }
          stems "dist/$ID/$VER/corpus.json" > /tmp/new
          notes=/tmp/notes.md
          printf 'Corpus `%s` **%s** — %s tropes.\n\n' "$ID" "$VER" "$(wc -l < /tmp/new)" > "$notes"
          PREV=$(aws s3api get-object --endpoint-url "$R2_S3_ENDPOINT" --bucket "$R2_BUCKET" --key "channels/$ID.stable.json" /tmp/prevchan.json >/dev/null 2>&1 && jq -r .version /tmp/prevchan.json || echo "")
          if [ -n "$PREV" ] && [ "$PREV" != "$VER" ] && \
             aws s3api get-object --endpoint-url "$R2_S3_ENDPOINT" --bucket "$R2_BUCKET" --key "$ID/$PREV/corpus.json" /tmp/prev.json >/dev/null 2>&1; then
            stems /tmp/prev.json > /tmp/old
            {
              printf 'Changes since **%s**:\n' "$PREV"
              if [ -n "$(comm -13 /tmp/old /tmp/new)" ]; then printf '\n**Added**\n'; comm -13 /tmp/old /tmp/new | sed 's/^/- /'; fi
              if [ -n "$(comm -23 /tmp/old /tmp/new)" ]; then printf '\n**Removed**\n'; comm -23 /tmp/old /tmp/new | sed 's/^/- /'; fi
              [ -z "$(comm -3 /tmp/old /tmp/new)" ] && printf '_Edits only — no tropes added or removed._\n'
            } >> "$notes"
          else
            printf '_First published version (no predecessor to diff)._\n' >> "$notes"
          fi
          printf '\nSee `CHANGELOG.md` for the curated notes. Deployed (immutable) but NOT yet live — run the **Promote Stable and Sync** action to move `stable` to this version.\n' >> "$notes"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$ID $VER" --notes-file "$notes" 2>/dev/null \
            || gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"

      # NOTE: deploy stops here — it publishes the immutable bundle but does NOT move the `stable` channel.
      # Promotion is a separate, human-triggered step: run the "Promote Stable and Sync" action (promote.yml)
      # to point `stable` at this version (writes the pointer to R2, regenerates the registry, and commits
      # the pointer back to the repo so git and R2 stay in sync).
