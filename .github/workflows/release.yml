# Prepare a corpus release as a PR (manual trigger). Bumps the version, syncs the publish self-check
# count, and rolls up the changelog (scripts/cut-release.sh), then opens a bot-authored "Release vX.Y.Z"
# PR — so you can approve it. Merging it triggers auto-tag.yml → publish.yml. Upstream-only.
name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump for the corpus version"
        type: choice
        options: [point, minor, major]
        default: point

permissions:
  contents: read

concurrency: release

jobs:
  prep:
    if: github.repository == 'kelnishi/tropelang-standard'
    runs-on: ubuntu-latest
    steps:
      # Mint the bot token FIRST and check out WITH it, so the remote is authed as the bot — otherwise
      # checkout pins an http.extraheader for GITHUB_TOKEN (read-only) that overrides any push-URL token.
      - name: mint conversion-bot token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CONVERSION_APP_ID }}
          private-key: ${{ secrets.CONVERSION_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}

      - name: install the latest tropelang CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          # Resolve the latest cli-v* release (NOT releases/latest — that can be a corpus-v* release).
          TAG=$(gh release list --repo kelnishi/tropelang-standard --limit 100 --json tagName \
                  --jq '[.[] | select(.tagName | startswith("cli-v"))][0].tagName')
          [ -n "$TAG" ] || { echo "::error::no cli-v* release found"; exit 1; }
          curl -fSL "https://github.com/kelnishi/tropelang-standard/releases/download/$TAG/tropelang-x86_64-linux" -o "$HOME/.local/bin/tropelang"
          chmod +x "$HOME/.local/bin/tropelang"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: prepare release (version + expect-tropes + changelog rollup)
        id: prep
        run: |
          NEW=$(bash scripts/cut-release.sh "${{ inputs.bump }}")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: open the release PR as the bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VER: ${{ steps.prep.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="release/$VER"
          git checkout -b "$BR"
          git commit -am "Release $VER"
          git push origin "$BR"        # remote is authed with the App token (checkout above)
          gh pr create --repo "${{ github.repository }}" --base main --head "$BR" \
            --title "Release $VER" \
            --body "Automated release prep for \`$VER\`: version bumped, \`--expect-tropes\` synced to the live count, CHANGELOG \`[Unreleased]\` rolled up. **Merge** to auto-tag \`corpus-v$VER\` → publish (then approve the \`production\` deployment). Promote by editing \`channels/standard.stable.json\`."
