# Prepare a corpus release as a PR (manual trigger). Bumps the version, syncs the publish self-check
# count, and rolls up the changelog (scripts/cut-release.sh), then opens a bot-authored "Release vX.Y.Z"
# PR — so you can approve it. Merging it triggers auto-tag.yml → publish.yml. Upstream-only.
name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump for the corpus version"
        type: choice
        options: [point, minor, major]
        default: point

permissions:
  contents: read

concurrency: release

jobs:
  prep:
    if: github.repository == 'kelnishi/tropelang-standard'
    runs-on: ubuntu-latest
    env:
      CLI_TAG: cli-v0.4.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: install pinned tropelang CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fSL "https://github.com/kelnishi/tropelang-standard/releases/download/${CLI_TAG}/tropelang-x86_64-linux" -o "$HOME/.local/bin/tropelang"
          chmod +x "$HOME/.local/bin/tropelang"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: prepare release (version + expect-tropes + changelog rollup)
        id: prep
        run: |
          NEW=$(bash scripts/cut-release.sh "${{ inputs.bump }}")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: mint conversion-bot token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CONVERSION_APP_ID }}
          private-key: ${{ secrets.CONVERSION_APP_PRIVATE_KEY }}

      - name: open the release PR as the bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VER: ${{ steps.prep.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="release/$VER"
          git checkout -b "$BR"
          git commit -am "Release $VER"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BR"
          gh pr create --repo "${{ github.repository }}" --base main --head "$BR" \
            --title "Release $VER" \
            --body "Automated release prep for \`$VER\`: version bumped, \`--expect-tropes\` synced to the live count, CHANGELOG \`[Unreleased]\` rolled up. **Merge** to auto-tag \`corpus-v$VER\` → publish (then approve the \`production\` deployment). Promote by editing \`channels/standard.stable.json\`."
