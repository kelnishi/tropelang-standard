# Auto-tag a corpus release: when corpus.toml's version changes on main and no matching tag exists yet,
# create corpus-v<version> → which triggers publish.yml. The tag is pushed with the conversion-bot App
# token, NOT GITHUB_TOKEN — a GITHUB_TOKEN-pushed tag does not trigger other workflows. Upstream-only.
name: auto-tag
on:
  push:
    branches: [main]
    paths: ['trl/tropes/corpus.toml']

permissions:
  contents: read

jobs:
  tag:
    if: github.repository == 'kelnishi/tropelang-standard'
    runs-on: ubuntu-latest
    steps:
      # Token first, then check out WITH it — so the App identity (not GITHUB_TOKEN) pushes the tag.
      # The App-token push is also what makes the tag trigger publish.yml (GITHUB_TOKEN pushes don't).
      - name: mint conversion-bot token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CONVERSION_APP_ID }}
          private-key: ${{ secrets.CONVERSION_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: tag the version (if new)
        run: |
          VER=$(grep -E '^version' trl/tropes/corpus.toml | head -1 | cut -d'"' -f2)
          TAG="corpus-v$VER"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — nothing to tag"; exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"       # remote is authed with the App token (checkout above)
          echo "### Tagged \`$TAG\` → publish.yml will run." >> "$GITHUB_STEP_SUMMARY"
