# Cloudflare Worker that fronts the R2 corpus bucket (spec 19 §6.2): cache headers, CORS, channel
# resolve. Deploy:  cd worker && npx wrangler deploy   (see README "Maintaining the standard corpus").
name = "tropelang-corpus"
main = "src/index.js"
compatibility_date = "2026-06-05"

# Serve at corpus.tropelang.com. Requires the tropelang.com zone in this Cloudflare account; wrangler
# creates the DNS record for the custom domain on deploy. NOTE: top-level keys must precede the first
# table header ([[r2_buckets]]) — otherwise TOML nests `routes` under it and wrangler ignores it.
routes = [
  { pattern = "corpus.tropelang.com", custom_domain = true },
]

# The R2 bucket holding the published bundles (create it first); the binding name `CORPUS` is what
# src/index.js reads.
[[r2_buckets]]
binding = "CORPUS"
bucket_name = "tropelang-corpus"
